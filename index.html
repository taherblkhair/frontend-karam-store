    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {
        if(f.fbq) return;
        n=f.fbq=function()
        {
          n.callMethod
            ? n.callMethod.apply(n,arguments)
            : n.queue.push(arguments);
        };
        if(!f._fbq) f._fbq=n;
        n.push=n;
        n.loaded=!0;
        n.version='2.0';
        n.queue=[];
        // Queued fbq() calls are replayed once fbevents.js loads; fetching it after
        // the page's own load keeps it from competing with the store's JS & images.
        var load=function(){
          t=b.createElement(e);
          t.async=!0;
          t.src=v;
          s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s);
        };
        if(b.readyState==='complete') load();
        else f.addEventListener('load',function(){ setTimeout(load,0); });
      }(
        window,
        document,
        'script',
        'https://connect.facebook.net/en_US/fbevents.js'
      );

      fbq('init', '1294312028698350');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    </noscript>

    <!--
      Start storefront API requests while the JS bundle is still downloading.
      Consumed once by src/core/api/earlyFetch.js (keys are API paths).
    -->
    <script>
      (function () {
        if (!window.fetch || !window.Promise) return;
        var base = '%KARAM_API_BASE%';
        var store = {};
        function get(path) {
          store[path] = fetch(base + path, { credentials: 'omit' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (/^\/(login|admin)(\/|$)/.test(path)) return;
        get('/store/settings');
        if (path === '/') get('/store/home');
        var m = path.match(/^\/product\/([^/]+)$/);
        if (m) {
          var slug = m[1];
          try { slug = decodeURIComponent(slug); } catch (e) {}
          slug = slug.trim();
          if (slug) get('/store/products/slug/' + encodeURIComponent(slug));
        }
        window.__KARAM_EARLY_FETCH__ = store;
      })();
    </script>

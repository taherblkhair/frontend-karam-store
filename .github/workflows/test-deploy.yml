name: Test Environment CI CD

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (ESLint)
        run: npm run lint --if-present

      - name: Build Project for Test
        run: npm run build

      - name: Deploy to cPanel Test
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.TEST_FTP_SERVER }}
          username: ${{ secrets.TEST_FTP_USERNAME }}
          password: ${{ secrets.TEST_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
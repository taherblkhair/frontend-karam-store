name: Test Environment CI CD

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest

    # Baked into JS at build time — browser calls this API directly
    env:
      VITE_API_BASE_URL: https://api.karamstore.ly
      VITE_MEDIA_BASE_URL: https://api.karamstore.ly

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (ESLint)
        run: npm run lint --if-present

      - name: Build for Test
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
          npm run build

      - name: Verify API URL baked into bundle
        run: |
          if ! grep -R -q "api.karamstore.ly" dist/assets/; then
            echo "ERROR: api.karamstore.ly missing from bundle — login will break"
            exit 1
          fi
          echo "OK: API host found in dist"

      - name: Deploy to cPanel Test
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.TEST_FTP_SERVER }}
          username: ${{ secrets.TEST_FTP_USERNAME }}
          password: ${{ secrets.TEST_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
